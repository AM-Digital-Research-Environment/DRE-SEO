name: Templates

# Dispatch is by resource template id, and every template map in
# config/instance.config.php is held to tests/Fixture/amira-templates.php — but
# that fixture is copied by hand, so nothing failed when the site gained
# templates 33 and 34. This compares the fixture with the templates the live
# site lists, daily, and fails when they differ; GitHub tells the workflow's
# owner of the failure. Not part of ci.yml: a pull request should not fail
# because the site is down, or because of a template it did not touch.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Fixture matches the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: json
          coverage: none
          tools: none

      - name: Compare the fixture with the site's resource templates
        run: php .github/scripts/check-templates.php
